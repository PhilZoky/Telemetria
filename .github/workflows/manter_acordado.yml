name: Manter Streamlit Acordado

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar navegador invisivel (Playwright)
        run: |
          pip install playwright
          playwright install chromium

      - name: Abrir app no navegador real para manter ativo
        run: |
          cat << 'EOF' > acordar.py
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("https://telemetria-tofly.streamlit.app/", timeout=60000)
              page.wait_for_timeout(15000)
              
              botao = page.locator("button:has-text('Yes, get this app back up')")
              if botao.count() > 0:
                  botao.click()
                  page.wait_for_timeout(30000)
                  
              browser.close()
          EOF
          python acordar.py
