name: Manter Streamlit Acordado

on:
  schedule:
    # Executa automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar o site para evitar hibernacao
        run: |
          curl -L -s "https://telemetria-tofly.streamlit.app" > /dev/null
