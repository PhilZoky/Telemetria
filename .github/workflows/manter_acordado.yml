name: Manter Streamlit Acordado

on:
  schedule:
    # Executa automaticamente a cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar navegador invisivel (Playwright)
        run: |
          pip install playwright
          playwright install chromium

      - name: Abrir app no navegador real para manter ativo
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://telemetria-tofly.streamlit.app/', timeout=60000)
              page.wait_for_timeout(15000)
              botao_acordar = page.locator('button:has-text(\"Yes, get this app back up\")')
              if botao_acordar.count() > 0:
                  botao_acordar.click()
                  page.wait_for_timeout(30000)
              browser.close()
          "
